<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chatbot UI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Inter:wght@300;400&family=Manjari:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #171717;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }

        .header {
            padding: 24px 20px;
        }
        .menu-icon {
            width: 24px;
            height: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
        }
        .menu-icon span {
            display: block;
            height: 2px;
            background-color: #ffffff;
            border-radius: 2px;
        }
        .menu-icon span:nth-child(1) { width: 100%; }
        .menu-icon span:nth-child(2) { width: 100%; }
        .menu-icon span:nth-child(3) { width: 60%; }

        /* മറുപടി കാണിക്കുന്ന പ്രധാന ഭാഗം */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
            text-align: center;
        }
        .greeting-text {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 500;
            margin: 0;
            letter-spacing: -0.5px;
            transition: opacity 0.3s ease;
        }
        
        /* ബോട്ടിന്റെ മറുപടിക്കുള്ള ഡിസൈൻ */
        .bot-response {
            font-family: 'Manjari', 'Inter', sans-serif;
            font-size: 24px;
            font-weight: 400;
            margin: 0;
            line-height: 1.5;
            color: #e0e0e0;
        }

        /* സ്പീക്കർ ബട്ടൺ */
        .speaker-btn {
            background: #212121;
            border: 1px solid #333;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: none; /* ആദ്യമേ മറച്ചുവെക്കുന്നു */
            justify-content: center;
            align-items: center;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s;
        }
        .speaker-btn:active {
            background: #333;
        }
        .speaker-btn svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* താഴെയുള്ള ഇൻപുട്ട് ബാർ (പഴയതുപോലെ തന്നെ) */
        .footer {
            padding: 20px;
            padding-bottom: 30px;
        }
        .input-bar {
            background-color: #212121;
            border-radius: 28px;
            display: flex;
            align-items: flex-end;
            padding: 12px 15px;
            min-height: 55px;
            box-sizing: border-box;
        }
        
        .icon-btn {
            background: none;
            border: none;
            color: #9e9e9e;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            outline: none;
            height: 30px;
            width: 30px;
            flex-shrink: 0;
        }
        .plus-icon {
            font-weight: 300;
            margin-right: 10px;
            font-size: 28px;
        }
        
        .text-input {
            flex: 1;
            background: none;
            border: none;
            color: #ffffff;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            outline: none;
            resize: none;
            min-height: 24px;
            max-height: 80px;
            overflow-y: auto;
            line-height: 24px;
            padding: 3px 0;
            margin-right: 10px;
        }
        .text-input::placeholder {
            color: #9e9e9e;
        }
        .text-input::-webkit-scrollbar {
            width: 0px;
        }
        
        .action-buttons {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon-btn svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: #9e9e9e;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .send-btn-style {
            background-color: #ffffff;
            border-radius: 50%;
            width: 32px;
            height: 32px;
        }
        .send-btn-style svg {
            width: 16px;
            height: 16px;
            fill: #171717;
            stroke: none;
            margin-left: 2px;
        }

        .pause-btn-style {
            background-color: #333333;
            border-radius: 50%;
            width: 32px;
            height: 32px;
        }
        .pause-btn-style svg {
            width: 14px;
            height: 14px;
            fill: #ffffff;
            stroke: none;
        }

        #sendBtn, #pauseBtn {
            display: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="menu-icon">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <!-- പ്രധാന സ്ക്രീൻ (മറുപടിയും സ്പീക്കറും വരുന്നത് ഇവിടെയാണ്) -->
    <div class="main-content">
        <h1 class="greeting-text" id="displayText">Let's get to work.</h1>
        
        <button class="speaker-btn" id="speakerBtn">
            <svg viewBox="0 0 24 24">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
        </button>
    </div>

    <!-- താഴെയുള്ള ഇൻപുട്ട് ബാർ -->
    <div class="footer">
        <div class="input-bar">
            <button class="icon-btn plus-icon">+</button>
            
            <textarea class="text-input" id="textInput" placeholder="Ask anything..." rows="1"></textarea>
            
            <div class="action-buttons">
                <button class="icon-btn pause-btn-style" id="pauseBtn">
                    <svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path></svg>
                </button>
                
                <button class="icon-btn" id="micBtn">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                        <line x1="8" y1="23" x2="16" y2="23"></line>
                    </svg>
                </button>
                
                <button class="icon-btn send-btn-style" id="sendBtn">
                    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        // UI Elements
        const textInput = document.getElementById('textInput');
        const micBtn = document.getElementById('micBtn');
        const sendBtn = document.getElementById('sendBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const displayText = document.getElementById('displayText');
        const speakerBtn = document.getElementById('speakerBtn');

        let isRecording = false;
        let botCurrentMessage = "";

        // Sarvam API Key
        const SARVAM_API_KEY = "sk_gqq94vnk_OKmHiHWgMNGo3ZqxVavPGwj5";

        // --- ഇൻപുട്ട് ബാർ ഫംഗ്ഷനുകൾ (പഴയതുപോലെ തന്നെ) ---
        function adjustTextareaHeight() {
            textInput.style.height = '24px'; 
            let newHeight = textInput.scrollHeight;
            if(newHeight > 80) newHeight = 80; 
            textInput.style.height = newHeight + 'px';
        }

        function updateButtonsUI() {
            if (isRecording) {
                micBtn.style.display = 'none';
                pauseBtn.style.display = 'flex';
                sendBtn.style.display = 'flex';
            } else {
                pauseBtn.style.display = 'none';
                if (textInput.value.trim().length > 0) {
                    micBtn.style.display = 'flex';
                    sendBtn.style.display = 'flex';
                } else {
                    micBtn.style.display = 'flex';
                    sendBtn.style.display = 'none';
                }
            }
        }

        textInput.addEventListener('input', function() {
            adjustTextareaHeight();
            updateButtonsUI();
        });

        // --- വോയ്‌സ് റെക്കഗ്നിഷൻ (സ്പീച്ച് ടു ടെക്സ്റ്റ്) ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;
        
        if(SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'ml-IN'; 
            let existingText = "";

            recognition.onstart = function() {
                isRecording = true;
                existingText = textInput.value.trim() ? textInput.value + " " : "";
                updateButtonsUI();
            };

            recognition.onresult = function(event) {
                let interimTranscript = '';
                let finalTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }
                textInput.value = existingText + finalTranscript + interimTranscript;
                adjustTextareaHeight();
                updateButtonsUI();
            };

            recognition.onend = function() {
                isRecording = false;
                updateButtonsUI();
            };
        }

        micBtn.addEventListener('click', () => {
            if (SpeechRecognition && !isRecording) {
                recognition.start();
            }
        });

        pauseBtn.addEventListener('click', () => {
            if (recognition && isRecording) {
                recognition.stop();
                isRecording = false;
                updateButtonsUI();
            }
        });

        // --- ചോദ്യം സെൻഡ് ചെയ്യുമ്പോൾ സംഭവിക്കുന്നത് ---
        sendBtn.addEventListener('click', () => {
            if (isRecording) recognition.stop();
            
            let userQuestion = textInput.value.trim();
            if(!userQuestion) return;

            // ബോക്സ് ക്ലിയർ ചെയ്യുന്നു
            textInput.value = '';
            adjustTextareaHeight();
            updateButtonsUI();
            
            // സ്പീക്കർ ബട്ടൺ മറയ്ക്കുന്നു
            speakerBtn.style.display = 'none';
            
            // ലോഡിങ് കാണിക്കുന്നു
            displayText.className = 'greeting-text';
            displayText.innerText = "ചിന്തിക്കുന്നു...";

            // എപിഐയിൽ നിന്നും ഉത്തരം ലഭിക്കുന്നു എന്ന് സങ്കൽപ്പിക്കുക (ഇവിടെ നിങ്ങളുടെ LLM API കൊടുക്കാം)
            setTimeout(() => {
                botCurrentMessage = "നിങ്ങൾ ചോദിച്ചതിന് നന്ദി. ഞാൻ നിങ്ങൾക്ക് സഹായിക്കാം. ഇത് ഒരു പരീക്ഷണ സന്ദേശമാണ്."; // ഇവിടെ എപിഐ മറുപടി നൽകാം
                
                // മറുപടി സ്ക്രീനിൽ കാണിക്കുന്നു
                displayText.className = 'bot-response';
                displayText.innerText = botCurrentMessage;
                
                // സ്പീക്കർ ബട്ടൺ കാണിക്കുന്നു
                speakerBtn.style.display = 'flex';
            }, 1500);
        });

        // --- Sarvam API ഉപയോഗിച്ച് ശബ്ദം ഉണ്ടാക്കാനുള്ള ഫംഗ്ഷൻ ---
        speakerBtn.addEventListener('click', async () => {
            if(!botCurrentMessage) return;
            
            speakerBtn.style.opacity = '0.5'; // ശബ്ദം ലോഡ് ചെയ്യുമ്പോൾ ബട്ടൺ മങ്ങാൻ
            
            try {
                // നിങ്ങൾ തന്ന Sarvam API കോഡ് ഇവിടെ fetch രൂപത്തിൽ നൽകിയിരിക്കുന്നു
                const response = await fetch("https://api.sarvam.ai/text-to-speech", {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'api-subscription-key': SARVAM_API_KEY
                    },
                    body: JSON.stringify({
                        "inputs": [botCurrentMessage],
                        "target_language_code": "ml-IN", // മലയാളം
                        "speaker": "arvind_ml_customer", // പുരുഷ ശബ്ദം (Sarvam AI-യിലെ ID)
                        "model": "bulbul:v4-flash"
                    })
                });

                if (!response.ok) throw new Error("API Error");

                const data = await response.json();
                
                if (data.audios && data.audios.length > 0) {
                    // Base64 ഓഡിയോ പ്ലേ ചെയ്യുന്നു
                    const audioBase64 = data.audios[0];
                    const audio = new Audio("data:audio/wav;base64," + audioBase64);
                    audio.play();
                }
            } catch (error) {
                console.error("Audio generation failed:", error);
                alert("ശബ്ദം ലഭ്യമാക്കുന്നതിൽ തകരാർ സംഭവിച്ചു. എപിഐ കീ പരിശോധിക്കുക.");
            } finally {
                speakerBtn.style.opacity = '1';
            }
        });

    </script>
</body>
</html>
