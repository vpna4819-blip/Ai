<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Functional Voice Chatbot</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Inter:wght@300;400&family=Manjari:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #171717;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* ഹെഡർ */
        .header {
            padding: 24px 20px;
            background-color: #171717;
            z-index: 10;
            border-bottom: 1px solid #2a2a2a;
        }
        .menu-icon {
            width: 24px;
            height: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
        }
        .menu-icon span {
            display: block;
            height: 2px;
            background-color: #ffffff;
            border-radius: 2px;
        }
        .menu-icon span:nth-child(1), .menu-icon span:nth-child(2) { width: 100%; }
        .menu-icon span:nth-child(3) { width: 60%; }

        /* ചാറ്റ് ബോക്സ് ഏരിയ */
        .chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
        }
        
        .message-wrapper {
            display: flex;
            width: 100%;
        }
        .message-wrapper.user {
            justify-content: flex-end; 
        }
        .message-wrapper.bot {
            justify-content: flex-start; 
        }
        
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 16px;
            line-height: 1.5;
            font-family: 'Manjari', 'Inter', sans-serif;
            word-wrap: break-word;
        }
        .message.user-msg {
            background-color: #3b82f6; 
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }
        .message.bot-msg {
            background-color: #2b2b2b; 
            color: #ffffff;
            border-bottom-left-radius: 4px;
        }
        .message.error-msg {
            background-color: #ef4444; /* എറർ വന്നാൽ ചുവപ്പ് നിറം */
            color: #ffffff;
            border-bottom-left-radius: 4px;
        }

        /* താഴെയുള്ള ഇൻപുട്ട് ബാർ */
        .footer {
            padding: 15px 20px 25px 20px;
            background-color: #171717;
        }
        .input-bar {
            background-color: #212121;
            border-radius: 28px;
            display: flex;
            align-items: flex-end;
            padding: 12px 15px;
            min-height: 55px;
            box-sizing: border-box;
        }
        
        .icon-btn {
            background: none;
            border: none;
            color: #9e9e9e;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
            height: 30px;
            width: 30px;
            flex-shrink: 0;
        }
        .plus-icon {
            font-weight: 300;
            margin-right: 10px;
            font-size: 28px;
        }
        
        .text-input {
            flex: 1;
            background: none;
            border: none;
            color: #ffffff;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            outline: none;
            resize: none;
            min-height: 24px;
            max-height: 80px;
            overflow-y: auto;
            line-height: 24px;
            padding: 3px 0;
            margin-right: 10px;
        }
        .text-input::placeholder { color: #9e9e9e; }
        .text-input::-webkit-scrollbar { width: 0px; }
        
        .action-buttons {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .icon-btn svg {
            width: 22px; height: 22px; fill: none; stroke: #9e9e9e; stroke-width: 2;
            stroke-linecap: round; stroke-linejoin: round;
        }

        .send-btn-style {
            background-color: #ffffff; border-radius: 50%; width: 32px; height: 32px;
        }
        .send-btn-style svg {
            width: 16px; height: 16px; fill: #171717; stroke: none; margin-left: 2px;
        }

        .pause-btn-style {
            background-color: #333333; border-radius: 50%; width: 32px; height: 32px;
        }
        .pause-btn-style svg {
            width: 14px; height: 14px; fill: #ffffff; stroke: none;
        }

        #sendBtn, #pauseBtn { display: none; }
        
        .typing-indicator {
            font-size: 14px; color: #888; font-style: italic; display: none;
            margin-left: 10px;
        }

    </style>
</head>
<body>

    <div class="header">
        <div class="menu-icon">
            <span></span><span></span><span></span>
        </div>
    </div>

    <!-- മെസ്സേജുകൾ കാണിക്കുന്ന സ്ഥലം -->
    <div class="chat-container" id="chatContainer"></div>
    <div class="typing-indicator" id="typingIndicator">ചിന്തിക്കുന്നു...</div>

    <div class="footer">
        <div class="input-bar">
            <button class="icon-btn plus-icon">+</button>
            <textarea class="text-input" id="textInput" placeholder="Ask anything..." rows="1"></textarea>
            
            <div class="action-buttons">
                <button class="icon-btn pause-btn-style" id="pauseBtn">
                    <svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path></svg>
                </button>
                <button class="icon-btn" id="micBtn">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                        <line x1="8" y1="23" x2="16" y2="23"></line>
                    </svg>
                </button>
                <button class="icon-btn send-btn-style" id="sendBtn">
                    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const textInput = document.getElementById('textInput');
        const micBtn = document.getElementById('micBtn');
        const sendBtn = document.getElementById('sendBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const chatContainer = document.getElementById('chatContainer');
        const typingIndicator = document.getElementById('typingIndicator');

        let isRecording = false;

        // Sarvam API Key
        const SARVAM_API_KEY = "sk_gqq94vnk_OKmHiHWgMNGo3ZqxVavPGwj5";

        function adjustTextareaHeight() {
            textInput.style.height = '24px'; 
            let newHeight = textInput.scrollHeight;
            if(newHeight > 80) newHeight = 80; 
            textInput.style.height = newHeight + 'px';
        }

        function updateButtonsUI() {
            if (isRecording) {
                micBtn.style.display = 'none';
                pauseBtn.style.display = 'flex';
                sendBtn.style.display = 'flex';
            } else {
                pauseBtn.style.display = 'none';
                if (textInput.value.trim().length > 0) {
                    micBtn.style.display = 'flex';
                    sendBtn.style.display = 'flex';
                } else {
                    micBtn.style.display = 'flex';
                    sendBtn.style.display = 'none';
                }
            }
        }

        textInput.addEventListener('input', function() {
            adjustTextareaHeight();
            updateButtonsUI();
        });

        // മെസ്സേജ് സ്ക്രീനിൽ ചേർക്കുന്ന ഫംഗ്ഷൻ (Error മോഡും ചേർത്തിട്ടുണ്ട്)
        function appendMessage(text, sender, isError = false) {
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${sender}`;
            
            const msgBubble = document.createElement('div');
            msgBubble.className = `message ${sender}-msg`;
            if (isError) msgBubble.classList.add('error-msg');
            
            msgBubble.innerText = text;
            wrapper.appendChild(msgBubble);
            chatContainer.appendChild(wrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // --- 1. LLM API (മറുപടി കണ്ടെത്താൻ) ---
        async function fetchBotReply(userQuestion) {
            try {
                // ഇവിടെ യഥാർത്ഥത്തിൽ നിങ്ങളുടെ LLM (ഉദാ: OpenAI) API കോൾ ആണ് വരേണ്ടത്.
                // ഞാൻ ഇതിൽ പരീക്ഷണത്തിനായി ഒരു ഉത്തരം നൽകുന്നു:
                if(userQuestion.includes("error") || userQuestion.includes("തെറ്റ്")) {
                    throw new Error("User requested an error simulation");
                }
                
                return { 
                    text: "നിങ്ങൾ പറഞ്ഞത് എനിക്ക് വ്യക്തമായി മനസ്സിലായി. എന്നാൽ ഒരു ചാറ്റ് ബോട്ട് എന്ന നിലയിൽ പൂർണ്ണമായ വിവരങ്ങൾ നൽകാൻ എനിക്ക് ഒരു LLM API ബാക്ക്എൻഡ് ആവശ്യമാണ്. എങ്കിലും എന്റെ ശബ്ദം നിങ്ങൾക്ക് കൃത്യമായി കേൾക്കാമല്ലോ?", 
                    isError: false 
                };

            } catch(e) {
                console.error("LLM Error:", e);
                return { 
                    text: "ക്ഷമിക്കണം, നിങ്ങൾക്ക് മറുപടി നൽകുന്നതിൽ ഒരു സാങ്കേതിക തകരാർ സംഭവിച്ചിരിക്കുന്നു. ദയവായി വീണ്ടും ശ്രമിക്കുക.", 
                    isError: true 
                };
            }
        }

        // --- 2. ടെക്സ്റ്റിനെ ശബ്ദമാക്കാനുള്ള API (പുതിയ Stream Endpoint) ---
        async function playSarvamAudio(text) {
            try {
                const response = await fetch("https://api.sarvam.ai/text-to-speech/stream", {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'api-subscription-key': SARVAM_API_KEY
                    },
                    body: JSON.stringify({
                        "text": text,
                        "target_language_code": "ml-IN",
                        "speaker": "arvind_ml_customer", // മലയാളത്തിലുള്ള പുരുഷ ശബ്ദം
                        "model": "bulbul:v4-flash",
                        "pace": 1,
                        "speech_sample_rate": 24000
                    })
                });

                if (!response.ok) {
                    throw new Error("Sarvam TTS API Error");
                }

                // Stream response-നെ ഒരു Blob (Audio File) ആയി മാറ്റുന്നു
                const blob = await response.blob();
                const audioUrl = URL.createObjectURL(blob);
                const audio = new Audio(audioUrl);
                audio.play();

            } catch (error) {
                console.error("Audio playback failed:", error);
                
                // ശബ്ദം നൽകുന്ന എപിഐ വർക്ക് ചെയ്തില്ലെങ്കിൽ ബ്രൗസറിന്റെ ഇൻബിൽറ്റ് വോയ്‌സ് ഉപയോഗിച്ച് എറർ പറയുന്നു
                if ('speechSynthesis' in window) {
                    const fallbackUtterance = new SpeechSynthesisUtterance("ശബ്ദം ലഭ്യമാക്കുന്നതിൽ തകരാർ ഉണ്ട്.");
                    fallbackUtterance.lang = 'ml-IN';
                    window.speechSynthesis.speak(fallbackUtterance);
                }
            }
        }

        // --- വോയ്‌സ് ടൈപ്പിംഗ് (Web Speech API) ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;
        
        if(SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'ml-IN'; 
            let existingText = "";

            recognition.onstart = function() {
                isRecording = true;
                existingText = textInput.value.trim() ? textInput.value + " " : "";
                updateButtonsUI();
            };

            recognition.onresult = function(event) {
                let interimTranscript = '';
                let finalTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }
                textInput.value = existingText + finalTranscript + interimTranscript;
                adjustTextareaHeight();
                updateButtonsUI();
            };

            recognition.onend = function() {
                isRecording = false;
                updateButtonsUI();
            };
        }

        micBtn.addEventListener('click', () => {
            if (SpeechRecognition && !isRecording) recognition.start();
        });

        pauseBtn.addEventListener('click', () => {
            if (recognition && isRecording) {
                recognition.stop();
                isRecording = false;
                updateButtonsUI();
            }
        });

        // --- സെൻഡ് ചെയ്യുമ്പോൾ നടക്കുന്ന പ്രവർത്തനങ്ങൾ ---
        sendBtn.addEventListener('click', async () => {
            if (isRecording) {
                recognition.stop();
                isRecording = false;
            }
            
            let userText = textInput.value.trim();
            if(!userText) return;

            // 1. യൂസറിന്റെ ചോദ്യം വലതുവശത്ത് കാണിക്കുന്നു
            appendMessage(userText, 'user');
            
            textInput.value = '';
            adjustTextareaHeight();
            updateButtonsUI();
            
            typingIndicator.style.display = 'block';

            // 2. ബോട്ടിന്റെ മറുപടി API വഴി കണ്ടെത്തുന്നു
            let botReply = await fetchBotReply(userText);
            
            typingIndicator.style.display = 'none';

            // 3. ബോട്ടിന്റെ മറുപടി ഇടതുവശത്ത് കാണിക്കുന്നു (എറർ ആണെങ്കിൽ ചുവന്ന നിറത്തിൽ)
            appendMessage(botReply.text, 'bot', botReply.isError);

            // 4. മറുപടി ലഭിച്ച ഉടനെ ഓട്ടോമാറ്റിക് ആയി ശബ്ദം കേൾപ്പിക്കുന്നു (Sarvam Streaming API)
            playSarvamAudio(botReply.text);
        });

    </script>
</body>
</html>
